<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="619px" preserveAspectRatio="none" style="width:562px;height:619px;background:#FFFFFF;" version="1.1" viewBox="0 0 562 619" width="562px" zoomAndPan="magnify"><title>Red-Green-Refactor Cycle</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="177.5753" x="185.381" y="24.9659">Red-Green-Refactor Cycle</text><g id="red"><rect fill="#FFCCCC" height="58.1358" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="139.6155" x="173.7" y="131.5979"/><line style="stroke:#181818;stroke-width:0.5;" x1="173.7" x2="313.3155" y1="179.7338" y2="179.7338"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3519" x="183.7" y="151.5639">&#128308; RED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.6155" x="183.7" y="170.6318">Write a failing test</text></g><g id="green"><rect fill="#CCFFCC" height="77.2038" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="119.0216" x="7" y="275.2679"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="126.0216" y1="342.4717" y2="342.4717"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="48.7478" x="17" y="295.2339">&#9989; GREEN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="81.7457" x="17" y="314.3018">Make it pass</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.0216" x="17" y="333.3697">(simplest code)</text></g><g id="refactor"><rect fill="#CCCCFF" height="77.2038" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="138.9436" x="174.04" y="433.4779"/><line style="stroke:#181818;stroke-width:0.5;" x1="174.04" x2="312.9836" y1="500.6817" y2="500.6817"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85.1685" x="184.04" y="453.4439">&#9851;&#65039; REFACTOR</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.4316" x="184.04" y="472.5118">Improve design</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.9436" x="184.04" y="491.5797">(tests protect you)</text></g><ellipse cx="243.51" cy="56.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="243.51" cy="602.6779" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="243.51" cy="602.6779" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g id="elem_GMN2"><path d="M347.95,127.0679 L347.95,156.6679 L313.65,160.6679 L347.95,164.6679 L347.95,194.2717 A0,0 0 0 0 347.95,194.2717 L517.0694,194.2717 A0,0 0 0 0 517.0694,194.2717 L517.0694,137.0679 L507.0694,127.0679 L347.95,127.0679 A0,0 0 0 0 347.95,127.0679 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M507.0694,127.0679 L507.0694,137.0679 L517.0694,137.0679 L507.0694,127.0679 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.8676" x="353.95" y="147.0339">Test must fail.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.1194" x="353.95" y="166.1018">If it passes, something</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.7814" x="353.95" y="185.1697">is wrong with the test.</text></g><g id="elem_GMN5"><path d="M161.45,289.8079 L161.45,309.8679 L126.31,313.8679 L161.45,317.8679 L161.45,337.9438 A0,0 0 0 0 161.45,337.9438 L349.5813,337.9438 A0,0 0 0 0 349.5813,337.9438 L349.5813,299.8079 L339.5813,289.8079 L161.45,289.8079 A0,0 0 0 0 161.45,289.8079 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M339.5813,289.8079 L339.5813,299.8079 L349.5813,299.8079 L339.5813,289.8079 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.1313" x="167.45" y="309.7739">Write the minimum code.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.7316" x="167.45" y="328.8418">Fake It if unsure.</text></g><g id="elem_GMN8"><path d="M347.69,438.4779 L347.69,468.0779 L313.39,472.0779 L347.69,476.0779 L347.69,505.6817 A0,0 0 0 0 347.69,505.6817 L555.3373,505.6817 A0,0 0 0 0 555.3373,505.6817 L555.3373,448.4779 L545.3373,438.4779 L347.69,438.4779 A0,0 0 0 0 347.69,438.4779 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M545.3373,438.4779 L545.3373,448.4779 L555.3373,448.4779 L545.3373,438.4779 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.0154" x="353.69" y="458.4439">Eliminate duplication.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.2956" x="353.69" y="477.5118">Improve names.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.6473" x="353.69" y="496.5797">Run tests after each change.</text></g><!--link *start* to red--><g id="link_*start*_red"><path d="M243.51,66.5379 C243.51,81.1179 243.51,103.6679 243.51,125.3279 " fill="none" id="*start*-to-red" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="243.51,131.3279,247.51,122.3279,243.51,126.3279,239.51,122.3279,243.51,131.3279" style="stroke:#181818;stroke-width:1;"/></g><!--link red to green--><g id="link_red_green"><path d="M210.22,190.1079 C182.18,214.0579 146.392,244.6307 115.582,270.9507 " fill="none" id="red-to-green" sty